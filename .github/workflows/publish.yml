name: publish

# Publishes to npm with Trusted Publishing (OIDC): no token, no OTP. npm only
# accepts it from this repo + this workflow file, as configured on npmjs.com.
# Runs on a version tag (v1.2.3) or by hand from the Actions tab.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # prepublishOnly refuses to publish unless the integration test ran against
    # a real Postgres, so the job brings one up, same as test.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRLOCK_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
      - run: npm install -g npm@^11.15.0
      - run: npm install --no-audit --no-fund
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - name: Skip if this version is already on npm
        id: check
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "airlock-rls@$v" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"; echo "::notice::airlock-rls@$v is already published"
          fi
      - if: steps.check.outputs.already != 'true'
        run: npm publish --loglevel verbose
